<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Initial D San Francisco</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-family: var(--font-display);
            font-size: clamp(6rem, 20vw, 14rem);
            line-height: 1;
            color: var(--orange);
            text-shadow: var(--glow-orange);
            letter-spacing: 0.05em;
        }
        .error-tag {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.28em;
            color: var(--cyan);
            text-shadow: var(--glow-cyan);
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 2.8rem);
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        .error-sub {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="scanlines" aria-hidden="true"></div>

    <div class="error-page">
        <div>
            <div class="error-tag">// PAGE NOT FOUND</div>
            <div class="error-code">404</div>
            <div class="error-title">OFF THE COURSE</div>
            <p class="error-sub">
                This page doesn't exist.<br>
                Maybe you took a wrong line.
            </p>
            <a href="/" class="btn-primary">BACK TO HOME</a>
        </div>
    </div>
</body>
</html>
